<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Never serve secrets or PHP source (server.php is the only entry point)
        RewriteRule (^|/)\.env - [F,L]
        RewriteCond %{REQUEST_URI} !^/server\.php$
        RewriteRule \.php$ - [F,L]

        # Serve real files and directories directly
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Everything else (API routes, SPA routes) -> server.php, query intact
        RewriteRule ^ /server.php [QSA,L]
    </Directory>

    # Web app manifest MIME type
    AddType application/manifest+json .webmanifest

    <IfModule mod_headers.c>
        # Service worker + manifest must always revalidate so updates land
        <FilesMatch "^(sw\.js|manifest\.webmanifest)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        # Vite-hashed SPA assets are immutable -> cache hard
        <Location "/assets/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </Location>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
